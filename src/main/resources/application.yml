server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            # Nunca "*": solo los origenes explicitos del frontend (dev y prod via env).
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
      default-filters:
        # Cabeceras de seguridad basicas en toda respuesta que atraviesa el gateway.
        - SetResponseHeader=X-Content-Type-Options, nosniff
        - SetResponseHeader=X-Frame-Options, DENY
        - SetResponseHeader=Referrer-Policy, no-referrer
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/usuarios/**
        - id: lobby-service
          uri: ${LOBBY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/salas/**
        - id: game-service
          uri: ${GAME_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/partidas/**

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-shared-by-gateway-and-user-service}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  config: classpath:logback-spring.xml
